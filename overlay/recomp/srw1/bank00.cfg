# Super Ryu World 1 overlay (appended to the stock bank00.cfg by tools/regen_srw1.sh)
# AddmusicK SPC upload handshake loop ($80:8079, JSL/RTL). Its per-byte
# CPU<->SPC port spin is cycle-timing sensitive: keep it on the cycle-exact
# interpreter tier so uploads finish at the same SPC sample as the interpreter.
force_lle 808079
# Same treatment, applied generically to every AddmusicK CPU<->SPC port
# handshake entry (ROM scan for `CMP $214x / BNE *` spin loops: 808082, 8080AD,
# 8080C8, 8080DC, 8080EC, 808100 all live in this uploader family; 8E8291 is in
# bank $8E AMK code that has no compiled roots, so it already runs on the interpreter).
force_lle 8080B6
force_lle 8080F7
